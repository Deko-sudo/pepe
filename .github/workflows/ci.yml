name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mini-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mini-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ../../packages/quote-core && pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest

  quote-core:
    name: Quote Core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/quote-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: pytest

  migration:
    name: Migration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pepe
          POSTGRES_USER: pepe
          POSTGRES_PASSWORD: change_me
        options: >-
          --health-cmd "pg_isready -U pepe -d pepe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://pepe:change_me@localhost:5432/pepe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ../../packages/quote-core && pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic current | grep -F "006 (head)"
      - run: python ../../scripts/verify_asset_catalog_migration.py
      - run: PEPE_RUN_POSTGRES_INTEGRATION=1 pytest tests/test_session_concurrency_postgres.py -q
      - run: alembic downgrade 004
      - run: alembic current | grep -F "004"
      - run: alembic upgrade head
      - run: python ../../scripts/verify_asset_catalog_migration.py

  bot:
    name: Bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ../../packages/quote-core && pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest

  worker-integration:
    name: Worker integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pepe_stage6
          POSTGRES_USER: pepe_stage6
          POSTGRES_PASSWORD: pepe_stage6
        options: >-
          --health-cmd "pg_isready -U pepe_stage6 -d pepe_stage6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pepe_stage6:pepe_stage6@localhost:5432/pepe_stage6
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: pip install -e ../../packages/quote-core -e ../api
      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head
      - name: Install worker dependencies without an app-package collision
        run: pip uninstall -y pepe-api && pip install -e ../../packages/quote-core -e ".[dev]"
      - name: Run Stage 6 worker integration tests
        run: pytest tests/test_quote_refresh_integration.py -q

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [frontend, api, quote-core, migration, bot, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config
      - name: Validate deployment contract
        run: python scripts/verify_compose_deployment.py
      - name: Fresh Compose session deployment smoke
        env:
          TELEGRAM_BOT_TOKEN: ci-stage4-test-bot-token
        run: |
          set -euo pipefail
          docker compose down --remove-orphans
          docker compose build
          docker compose up -d api

          for attempt in $(seq 1 30); do
            migration_state=$(docker inspect --format '{{.State.Status}}' pepe-migrate)
            migration_exit_code=$(docker inspect --format '{{.State.ExitCode}}' pepe-migrate)
            if [ "$migration_state" = "exited" ]; then
              test "$migration_exit_code" = "0"
              break
            fi
            sleep 2
          done
          test "${migration_state:-}" = "exited"
          test "${migration_exit_code:-}" = "0"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8100/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:8100/api/v1/health >/dev/null
          docker compose exec -T api alembic current | grep -F "006 (head)"
          test "$(
            docker compose exec -T postgres psql -U pepe -d pepe -tAc \
              "SELECT to_regclass('public.user_sessions') IS NOT NULL"
          )" = "t"
          test "$(
            docker compose exec -T postgres psql -U pepe -d pepe -tAc \
              "SELECT count(*) FROM asset_instruments WHERE is_enabled"
          )" = "3"
          test "$(
            docker compose exec -T postgres psql -U pepe -d pepe -tAc \
              "SELECT to_regclass('public.latest_market_quotes') IS NOT NULL"
          )" = "t"

          python - <<'PY' >/tmp/pepe-session-payload.json
          import hashlib
          import hmac
          import json
          import os
          import time
          from urllib.parse import urlencode

          fields = {
              "auth_date": str(int(time.time())),
              "query_id": "ci-stage4",
              "user": json.dumps({"id": 424242, "first_name": "CI"}, separators=(",", ":")),
          }
          data_check_string = "\n".join(f"{key}={fields[key]}" for key in sorted(fields))
          secret = hmac.new(b"WebAppData", os.environ["TELEGRAM_BOT_TOKEN"].encode(), hashlib.sha256).digest()
          fields["hash"] = hmac.new(secret, data_check_string.encode(), hashlib.sha256).hexdigest()
          print(json.dumps({"init_data": urlencode(fields)}))
          PY

          curl --fail --silent --show-error \
            --cookie-jar /tmp/pepe-session.cookies \
            --header 'Origin: http://localhost:3000' \
            --header 'Content-Type: application/json' \
            --data @/tmp/pepe-session-payload.json \
            http://localhost:8100/api/v1/auth/telegram/session >/dev/null
          curl --fail --silent --show-error \
            --cookie /tmp/pepe-session.cookies \
            http://localhost:8100/api/v1/users/me >/dev/null
          curl --fail --silent --show-error \
            --cookie /tmp/pepe-session.cookies \
            --header 'Origin: http://localhost:3000' \
            --request POST \
            http://localhost:8100/api/v1/auth/logout-all >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/pepe-session.cookies \
            http://localhost:8100/api/v1/users/me)" = "401"

          ! docker compose logs --no-color | grep -F 'ci-stage4-test-bot-token'
          ! docker compose logs --no-color | grep -F 'query_id=ci-stage4'
          ! docker compose logs --no-color | grep -E 'pepe_session=|Set-Cookie|token_digest'
      - name: Clean Compose smoke resources
        if: always()
        run: docker compose down --remove-orphans
