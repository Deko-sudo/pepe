[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pepe-worker"
version = "0.1.0"
description = "Pepe Celery Worker"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.1.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = ["import-untyped", "untyped-decorator"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "vine.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
