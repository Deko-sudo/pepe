server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /run/pepe/embedded-chart-security/wrapper-security.conf;

    location = /health {
        default_type text/plain;
        try_files /health =404;
    }

    location ~ ^/chart/(btc-usdt|eth-usdt|xau-usd)/(1m|5m|15m|1h|4h|1d)$ {
        default_type text/html;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        default_type text/html;
        try_files /invalid.html =404;
    }
}
