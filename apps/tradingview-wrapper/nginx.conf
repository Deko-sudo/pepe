server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors http://127.0.0.1:4174; script-src 'self' https://s3.tradingview.com; style-src 'self' 'unsafe-inline'; img-src 'self'; frame-src https://s.tradingview.com; connect-src 'none'; font-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-read=(), clipboard-write=(), payment=(), fullscreen=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;

    location = /health {
        default_type text/plain;
        try_files /health =404;
    }

    location ~ ^/chart/(btc-usdt|eth-usdt|xau-usd)/(1m|5m|15m|1h|4h|1d)$ {
        default_type text/html;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        default_type text/html;
        try_files /invalid.html =404;
    }
}
