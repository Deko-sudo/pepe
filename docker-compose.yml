x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-migrate-environment: &migrate-environment
  DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://pepe:change_me@postgres:5432/pepe}"

x-api-environment: &api-environment
  <<: *migrate-environment
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  QUOTE_CACHE_URL: "${QUOTE_CACHE_URL:-redis://redis:6379/1}"
  QUOTE_FAKE_PROVIDER_ENABLED: "${QUOTE_FAKE_PROVIDER_ENABLED:-false}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4000,http://localhost:8080}"
  APP_ENV: "${APP_ENV:-development}"
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: "${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-3600}"
  TELEGRAM_INIT_DATA_FUTURE_SKEW_SECONDS: "${TELEGRAM_INIT_DATA_FUTURE_SKEW_SECONDS:-30}"
  SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-pepe_session}"
  SESSION_ABSOLUTE_TTL_SECONDS: "${SESSION_ABSOLUTE_TTL_SECONDS:-2592000}"
  SESSION_IDLE_TTL_SECONDS: "${SESSION_IDLE_TTL_SECONDS:-604800}"
  SESSION_MAX_ACTIVE: "${SESSION_MAX_ACTIVE:-5}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
  SESSION_ALLOWED_ORIGINS: "${SESSION_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4000,http://localhost:8080}"

services:
  mini-app:
    container_name: pepe-mini-app
    build:
      context: ./apps/mini-app
      dockerfile: Dockerfile
    ports:
      - "${MINI_APP_PORT:-4000}:80"
    depends_on:
      - api
    networks:
      - pepe-network

  api:
    container_name: pepe-api
    image: pepe-api
    build: *api-build
    ports:
      - "${API_EXT_PORT:-8100}:8000"
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pepe-network

  migrate:
    container_name: pepe-migrate
    image: pepe-api
    build: *api-build
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *migrate-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pepe-network

  bot:
    container_name: pepe-bot
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - MINI_APP_URL=${MINI_APP_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - pepe-network

  worker:
    container_name: pepe-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QUOTE_CACHE_URL=${QUOTE_CACHE_URL:-redis://redis:6379/1}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://pepe:change_me@postgres:5432/pepe}
      - QUOTE_FAKE_PROVIDER_ENABLED=${QUOTE_FAKE_PROVIDER_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pepe-network

  scheduler:
    container_name: pepe-scheduler
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QUOTE_CACHE_URL=${QUOTE_CACHE_URL:-redis://redis:6379/1}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://pepe:change_me@postgres:5432/pepe}
      - QUOTE_FAKE_PROVIDER_ENABLED=${QUOTE_FAKE_PROVIDER_ENABLED:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - pepe-network

  postgres:
    container_name: pepe-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pepe}
      - POSTGRES_USER=${POSTGRES_USER:-pepe}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pepe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pepe} -d ${POSTGRES_DB:-pepe}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pepe-network

  redis:
    container_name: pepe-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pepe-network

  caddy:
    container_name: pepe-caddy
    image: caddy:2-alpine
    ports:
      - "${CADDY_PORT:-8080}:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mini-app
      - api
    networks:
      - pepe-network

networks:
  pepe-network:
    driver: bridge

volumes:
  pepe_postgres_data:
  caddy_data:
  caddy_config:
